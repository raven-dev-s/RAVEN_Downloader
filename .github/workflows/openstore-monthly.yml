name: Build and publish to OpenStore

on:
  # GitHub Actions schedules use UTC. The first day of every month has fewer
  # competing scheduled workflows than the top of the hour.
  schedule:
    - cron: "23 04 1 * *"
  # Run CI on changes merged to main and preserve tag-based releases. Changes
  # to documentation alone do not make a new release for users.
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - LICENSE
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built packages to OpenStore
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Do not overlap OpenStore submissions. Each run publishes every architecture
# for both Ubuntu Touch 20.04 and 24.04.
concurrency:
  group: openstore-publish
  cancel-in-progress: false

jobs:
  # GitHub disables schedules after 60 days without repository activity, and
  # monthly releases make no commits. Re-enabling restarts that period.
  keep-schedule-active:
    name: Keep monthly schedule active
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/openstore-monthly.yml/enable"

  version:
    name: Generate package version
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.version.outputs.base }}
      suffix: ${{ steps.version.outputs.suffix }}
    steps:
      - uses: actions/checkout@v5

      # OpenStore keeps all releases since 20.04 in one channel and gives each
      # device the newest package for its framework. It rejects one version
      # number for two frameworks, so every package version names its series:
      # <base>.<series>[.<timestamp>], for example 4.3.0.2404.20261201042300.
      # 2404 sorts above 2004, which keeps 24.04 the default outside of devices.
      - id: version
        name: Choose release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            base="${GITHUB_REF_NAME#v}"
            suffix=""
          else
            base="$(sed -n 's/^set(PROJECT_VERSION "\([^"]*\)")/\1/p' CMakeLists.txt)"
            test -n "${base}"
            suffix=".$(date -u +%Y%m%d%H%M%S)"
          fi
          echo "base=${base}" >> "${GITHUB_OUTPUT}"
          echo "suffix=${suffix}" >> "${GITHUB_OUTPUT}"
          echo "Building version ${base}.<series>${suffix}"

  build:
    name: Build (${{ matrix.series }} ${{ matrix.arch }})
    needs: version
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            series: "2404"
            framework: ubuntu-touch-24.04-1.x
            image: clickable/ci-dev-ut24.04-1.x-arm64:8
            build_dir: build/aarch64-linux-gnu/app
          - arch: amd64
            series: "2404"
            framework: ubuntu-touch-24.04-1.x
            image: clickable/ci-dev-ut24.04-1.x-amd64:8
            build_dir: build/x86_64-linux-gnu/app
          - arch: armhf
            series: "2404"
            framework: ubuntu-touch-24.04-1.x
            image: clickable/ci-dev-ut24.04-1.x-armhf:8
            build_dir: build/arm-linux-gnueabihf/app
          - arch: arm64
            series: "2004"
            framework: ubuntu-sdk-20.04
            image: clickable/ci-dev-20.04-arm64:8
            build_dir: build/aarch64-linux-gnu/app
          - arch: amd64
            series: "2004"
            framework: ubuntu-sdk-20.04
            image: clickable/ci-dev-20.04-amd64:8
            build_dir: build/x86_64-linux-gnu/app
          - arch: armhf
            series: "2004"
            framework: ubuntu-sdk-20.04
            image: clickable/ci-dev-20.04-armhf:8
            build_dir: build/arm-linux-gnueabihf/app
    env:
      BUILD_VERSION: ${{ needs.version.outputs.base }}.${{ matrix.series }}${{ needs.version.outputs.suffix }}
      CLICKABLE_FRAMEWORK: ${{ matrix.framework }}
      # A scheduled release must resolve the current yt-dlp release rather
      # than a package cached in a prior container layer.
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Build Click package with the latest yt-dlp
        run: clickable build --arch "${{ matrix.arch }}"

      # Clickable already reviews automatically after `build`. Keep this
      # explicit review gate as well: it makes the OpenStore prerequisite
      # visible in CI and prevents an artifact upload on any review finding.
      - name: Verify Click package passes automated review
        run: clickable review --arch "${{ matrix.arch }}"

      - name: Upload Click package
        uses: actions/upload-artifact@v6
        with:
          name: raven-downloader-${{ matrix.series }}-${{ matrix.arch }}
          path: ${{ matrix.build_dir }}/*.click
          if-no-files-found: error
          retention-days: 31

  publish:
    name: Publish (${{ matrix.series }} ${{ matrix.arch }})
    needs:
      - version
      - build
    # Main pushes, scheduled builds, and version tags publish automatically.
    # Manual runs can build without publishing unless the caller enables it.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    environment: openstore
    strategy:
      fail-fast: false
      # Each upload updates the same OpenStore app record. Submit one
      # package at a time to avoid concurrent app updates. The record takes its
      # details from the latest upload, so the current series goes last.
      max-parallel: 1
      matrix:
        include:
          - arch: arm64
            series: "2004"
            framework: ubuntu-sdk-20.04
            image: clickable/ci-dev-20.04-arm64:8
            build_dir: build/aarch64-linux-gnu/app
          - arch: amd64
            series: "2004"
            framework: ubuntu-sdk-20.04
            image: clickable/ci-dev-20.04-amd64:8
            build_dir: build/x86_64-linux-gnu/app
          - arch: armhf
            series: "2004"
            framework: ubuntu-sdk-20.04
            image: clickable/ci-dev-20.04-armhf:8
            build_dir: build/arm-linux-gnueabihf/app
          - arch: arm64
            series: "2404"
            framework: ubuntu-touch-24.04-1.x
            image: clickable/ci-dev-ut24.04-1.x-arm64:8
            build_dir: build/aarch64-linux-gnu/app
          - arch: amd64
            series: "2404"
            framework: ubuntu-touch-24.04-1.x
            image: clickable/ci-dev-ut24.04-1.x-amd64:8
            build_dir: build/x86_64-linux-gnu/app
          - arch: armhf
            series: "2404"
            framework: ubuntu-touch-24.04-1.x
            image: clickable/ci-dev-ut24.04-1.x-armhf:8
            build_dir: build/arm-linux-gnueabihf/app
    env:
      OPENSTORE_API_KEY: ${{ secrets.OPENSTORE_API_KEY }}
      BUILD_VERSION: ${{ needs.version.outputs.base }}.${{ matrix.series }}${{ needs.version.outputs.suffix }}
      CLICKABLE_FRAMEWORK: ${{ matrix.framework }}
    steps:
      - uses: actions/checkout@v5

      - name: Download Click package
        uses: actions/download-artifact@v7
        with:
          name: raven-downloader-${{ matrix.series }}-${{ matrix.arch }}
          path: ${{ matrix.build_dir }}

      - name: Show Click package
        shell: bash
        run: |
          set -euo pipefail
          find "${{ matrix.build_dir }}" -maxdepth 1 -type f -name '*.click' -print

      # `clickable publish` reads the manifest from the install directory even
      # when the completed Click package is already available. Reconstruct that
      # one metadata file from the downloaded artifact; do not rebuild it.
      - name: Restore Clickable publish metadata
        shell: bash
        run: |
          set -euo pipefail
          build_dir="${{ matrix.build_dir }}"
          click_file="$(find "${build_dir}" -maxdepth 1 -type f -name '*.click' -print -quit)"
          test -n "${click_file}"
          mkdir -p "${build_dir}/install"
          dpkg-deb --ctrl-tarfile "${click_file}" \
            | tar -xOf - --wildcards --no-anchored '*manifest*' \
              > "${build_dir}/install/manifest.json"
          test -s "${build_dir}/install/manifest.json"

      - name: Publish to OpenStore
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENSTORE_API_KEY}"
          publish_log="$(mktemp)"
          trap 'rm -f "$publish_log"' EXIT
          # OpenStore adds the changelog of every upload to the app's changelog.
          # Write the note for one package of the release, not all six.
          changelog=()
          if [[ "${{ matrix.series }}-${{ matrix.arch }}" == "2404-arm64" ]]; then
            case "${GITHUB_EVENT_NAME}" in
              schedule) changelog=(-- "Monthly build with the latest yt-dlp release.") ;;
              *) changelog=(-- "Version ${{ needs.version.outputs.base }} for Ubuntu Touch 20.04 and 24.04, with the latest yt-dlp release.") ;;
            esac
          fi
          for attempt in 1 2 3 4 5; do
            if clickable publish --arch "${{ matrix.arch }}" --timeout 600 "${changelog[@]}" 2>&1 | tee "$publish_log"; then
              break
            else
              status=$?
            fi
            # Retry upload timeouts, rate limits, and OpenStore server errors.
            # Review, authentication, and other client errors stay fatal.
            if ! grep -Eiq '\((429|5[0-9]{2})\)|Upload timed out' "$publish_log" || [[ "$attempt" -eq 5 ]]; then
              exit "$status"
            fi
            echo "OpenStore returned a transient error; retrying upload (attempt $((attempt + 1))/5)."
            sleep "$((15 * attempt))"
          done
